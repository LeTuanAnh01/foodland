function mainShell(){return `<div class="app"><aside class="sidebar">${brandLogo()}<div class="side-label">Không gian làm việc</div><nav>${navs.map(n=>`<a href="#${n[0]}" class="nav-link ${state.page===n[0]?'active':''}" data-nav="${n[0]}" title="${n[2]}">${ic(n[1],17)}<span>${n[2]}</span>${n[0]==='purchases'&&data.purchases.some(x=>!data.purchaseInvoices.some(z=>z.purchaseId===x.id))?'<span class="side-count">!</span>':''}</a>`).join('')}</nav><div class="side-space"></div><div class="side-tip"><div class="tip-icon">${ic('leaf',21)}</div><strong>Prototype tương tác</strong><p>Dữ liệu giả lập. Thao tác ngay trên trình duyệt, không cần máy chủ.</p><span class="demo-ribbon">UI REVIEW · V2.0</span></div><div class="side-foot"><div class="avatar">FL</div><div><b>Demo Foodland</b><span>Chế độ xem thử</span></div></div></aside><div class="main-shell"><header class="topbar"><div class="top-search">${ic('search',16)}<input id="globalSearch" placeholder="Tìm hàng hóa, chứng từ, đối tác..." autocomplete="off"/><kbd>⌘ K</kbd></div><div class="top-actions"><span class="demo-ribbon">MOCK DATA</span><button class="top-icon" data-action="toggle-notice" title="Thông báo">${ic('bell',19)}<i class="notify-dot"></i></button><button class="top-icon" data-action="about" title="Giới thiệu">${ic('help',19)}</button><div class="profile"><div class="avatar">FL</div><div><strong>Foodland Demo</strong><small>Người xem thử</small></div>${ic('chevron',14)}</div></div></header><main class="content" id="page-content"></main></div></div>`}
function header(title,desc,extra=''){return `<div class="breadcrumb">${ic('home',13)} ${ic('right',12)} <span class="crumb-current">${e(title)}</span></div><div class="head-row"><div><h1 class="head-title">${e(title)}</h1><p class="head-desc">${e(desc)}</p></div><div class="head-badges"><span class="demo-pill">${ic('info',14)} Dữ liệu mô phỏng</span>${extra}</div></div>`}
function tabs(items,active,action='tab'){return `<div class="section-tabs">${items.map(([id,txt])=>`<button data-${action}="${id}" class="section-tab ${active===id?'active':''}">${e(txt)}</button>`).join('')}</div>`}
function chart(valuesA=[60,80,77,110,88,100,112,96,128,110,120,135],valuesB=[44,60,69,70,75,85,70,82,95,85,78,90]){const max=Math.max(...valuesA,...valuesB,150);return `<div class="chart-wrap"><div class="chart-lines">${[150,100,50,0].map(n=>`<div><span>${n}tr</span></div>`).join('')}</div>${valuesA.map((a,i)=>`<div class="chart-col"><div class="bar bar-a" style="height:${a/max*86}%" title="Doanh thu T${i+1}: ${a} triệu"></div><div class="bar bar-b" style="height:${valuesB[i]/max*86}%" title="Mua hàng T${i+1}: ${valuesB[i]} triệu"></div><label>T${i+1}</label></div>`).join('')}</div><div class="legend"><span><i style="background:#126b50"></i>Giá trị bán hàng</span><span><i style="background:#83ccb1"></i>Giá trị mua hàng</span></div>`}
function toolbar({type='generic',search='Tìm theo mã, tên...',filterOptions=[],right='',exportKey=''}){return `<div class="toolbar"><div class="r-flex" style="flex:1;min-width:210px">${ic('search',17)}<input id="local-search" class="field field-search" value="${e(state.search)}" placeholder="${e(search)}" data-role="search" aria-label="Tìm kiếm"/></div>${filterOptions.length?`<select class="field" data-role="filter">${filterOptions.map(([v,l])=>`<option value="${e(v)}" ${state.filter===v?'selected':''}>${e(l)}</option>`).join('')}</select>`:''}${right}${exportKey?`<div class="right">${btn(ic('download',15)+' Xuất CSV','export:'+exportKey,'btn-sm')}</div>`:''}</div>`}
function tableWrap(headings,rows,emptyText='Không tìm thấy dữ liệu phù hợp'){return `<div class="table-scroll"><table><thead><tr>${headings.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headings.length}" style="padding:45px;text-align:center;color:#9aaba0">${e(emptyText)}</td></tr>`}</tbody></table></div>`}
function footer(count){return `<div class="table-footer"><span>Hiển thị ${count} bản ghi · Dữ liệu mẫu dùng để duyệt giao diện</span><div class="pager"><button class="page-btn">${ic('left',13)}</button><button class="page-btn current">1</button><button class="page-btn">${ic('right',13)}</button></div></div>`}
function filtered(items,formatter){const key=state.search.toLowerCase().trim();return items.filter(o=>(state.filter==='all'||formatter.filter(o)===state.filter)&&(!key||formatter.search(o).toLowerCase().includes(key)))}
function productRows(items){return items.map(p=>`<tr><td><span class="table-cell-link" data-action="detail:product:${e(p.id)}">${e(p.id)}</span></td><td><strong class="table-cell-link" data-action="detail:product:${e(p.id)}">${e(p.name)}</strong></td><td>${e(p.category)}</td><td>${e(p.unit)}</td><td>${e(p.spec||'—')}</td><td>${e(sourceName(p))}</td><td>${money(p.price)}</td><td>${btn(ic('edit',15),'edit:product:'+e(p.id),'btn-icon btn-ghost btn-sm')}</td></tr>`).join('')}
function productTable(items){return tableWrap(['MÃ HÀNG','TÊN HÀNG','NHÓM HÀNG','ĐƠN VỊ','QUY CÁCH / THÔNG SỐ','NGUỒN NHẬP / NHÀ CUNG CẤP','GIÁ THAM KHẢO',''],productRows(items))}
function productOptions(selected=''){return data.products.map(p=>`<option value="${e(p.id)}" ${p.id===selected?'selected':''}>${e(p.id)} · ${e(p.name)}</option>`).join('')}
function partnerOptions(kind,selected=''){return `<option value="">Chọn ${kind==='supplier'?'nhà cung cấp':'khách hàng'}</option>`+data.partners.filter(p=>p.kind===kind).map(p=>`<option value="${e(p.id)}" ${p.id===selected?'selected':''}>${e(p.name)}</option>`).join('')}
const sourceName=p=>p.supplierId?partner(p.supplierId):'Chưa xác định';
function sortedReports(){return [...data.purchases.map(x=>({...x,kind:'Mua',kindKey:'buy'})),...data.sales.map(x=>({...x,kind:'Bán',kindKey:'sell'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||a.id.localeCompare(b.id))}
function reportRows(){const q=state.reportSearch.toLowerCase().trim();return sortedReports().filter(x=>(state.reportDocKind==='all'||x.kindKey===state.reportDocKind)&&(!q||(x.id+' '+partner(x.partnerId)+' '+x.note+' '+x.items.map(it=>product(it.productId).name).join(' ')).toLowerCase().includes(q)))}
function bestSellers(){let map=new Map();data.sales.filter(x=>x.status!=='Bản nháp').forEach(doc=>doc.items.forEach(it=>{let item=map.get(it.productId)||{id:it.productId,qty:0,value:0};item.qty+=+it.qty||0;item.value+=(+it.qty||0)*(+it.price||0);map.set(it.productId,item)}));return [...map.values()].sort((a,b)=>b.qty-a.qty).slice(0,5)}
function inventoryTable(items){return tableWrap(['MÃ HÀNG','TÊN HÀNG HÓA','ĐƠN VỊ','SỐ LƯỢNG TỒN','TỒN TỐI THIỂU','TÌNH TRẠNG',''],items.map(p=>{const [label,tone]=stockStatus(p);return `<tr><td><strong>${e(p.id)}</strong></td><td>${e(p.name)}</td><td>${e(p.unit)}</td><td><strong>${number(p.stock)}</strong></td><td>${number(p.min)}</td><td>${badge(label,tone)}</td><td>${btn(ic('edit',15),'edit:stock:'+e(p.id),'btn-sm')}</td></tr>`}).join(''))}
function pageDashboard(){const sellers=bestSellers(),top=sellers[0]?.qty||1;const movements=data.movements.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);return header('Tổng quan kinh doanh','Theo dõi hoạt động nhập/xuất và mặt hàng bán chạy trong bản demo',btn(ic('calendar',16)+' Tháng 10/2026','date-info'))+`<div class="metrics">${metric('Giá trị bán hàng (mẫu)','125.000.000 ₫','trending','green','Số liệu minh họa')}${metric('Giá trị mua hàng (mẫu)','82.000.000 ₫','cart','orange','Số liệu minh họa')}${metric('Giá trị tồn kho (mẫu)','215.000.000 ₫','warehouse','blue','Chưa chốt cách tính')}${metric('Số mặt hàng',data.products.length,'box','purple','Danh mục sản phẩm')}</div><div class="twocol"><div class="panel"><div class="panel-head"><div><h2>Giá trị mua và bán theo tháng</h2><p>Biểu đồ minh họa để kế toán duyệt cách trình bày</p></div><span class="note-tag">MẪU MINH HỌA</span></div><div class="panel-body">${chart()}</div></div><div class="panel"><div class="panel-head"><div><h2>Top mặt hàng bán chạy</h2><p>Xếp theo số lượng trên chứng từ bán đã lưu (mẫu)</p></div><button class="inline-link" data-nav="sales">Xem bán hàng ${ic('arrow',13)}</button></div><div class="seller-list">${sellers.length?sellers.map((s,i)=>`<div class="seller-row"><span class="seller-rank">${i+1}</span><div class="seller-main"><div class="r-between"><strong>${e(product(s.id).name)}</strong><b>${number(s.qty)} ${e(product(s.id).unit)}</b></div><div class="seller-track"><i style="width:${s.qty/top*100}%"></i></div></div></div>`).join(''):'<div class="empty-note">Chưa có dữ liệu chứng từ bán mẫu</div>'}</div></div></div><div class="panel table-panel"><div class="table-header"><div><div class="table-title">Lịch sử nhập – xuất kho gần đây</div><div class="table-sub">Các phiếu kho mẫu đã ghi nhận · tách biệt với danh mục hàng hóa</div></div>${btn('Đến quản lý kho '+ic('arrow',15),'nav:inventory')}</div>${tableWrap(['NGÀY','MÃ PHIẾU','LOẠI GIAO DỊCH','MẶT HÀNG','SỐ LƯỢNG','GHI CHÚ'],movements.map(m=>`<tr><td>${dmy(m.date)}</td><td><span class="table-cell-link" data-action="detail:movement:${e(m.id)}">${e(m.id)}</span></td><td>${badge(m.kind,m.kind==='Nhập kho'?'green':'orange')}</td><td><strong>${e(product(m.productId).name)}</strong></td><td class="amount ${m.kind==='Nhập kho'?'amount-in':'amount-out'}">${m.kind==='Nhập kho'?'+':'−'}${number(m.qty)} ${e(product(m.productId).unit)}</td><td>${e(m.note||'—')}</td></tr>`).join(''))}${footer(movements.length)}</div><p class="report-footnote">Dashboard là bố cục demo; số tổng hợp chưa được kế toán duyệt công thức. Các phiếu kho và chứng từ hiện không tự động cập nhật số tồn.</p>`}
function pageProducts(){let list=filtered(data.products,{filter:p=>p.category,search:p=>p.id+' '+p.name+' '+p.category+' '+(p.spec||'')+' '+sourceName(p)});const groups=[...new Set(data.products.map(p=>p.category))];return header('Danh mục hàng hóa','Mặt hàng công ty kinh doanh: thông số, đơn vị, nguồn nhập và giá tham khảo',btn(ic('plus',15)+' Thêm hàng hóa','new:product','btn-primary'))+`<div class="metrics">${metric('Tổng mặt hàng',data.products.length,'box','green','Đang có trong danh mục')}${metric('Nhóm hàng',groups.length,'layers','blue','Các nhóm mặt hàng mẫu')}${metric('Nguồn nhập',new Set(data.products.map(p=>p.supplierId).filter(Boolean)).size,'users','orange','Nhà cung cấp tham khảo')}${metric('Đơn vị tính',new Set(data.products.map(p=>p.unit)).size,'file','purple','Đơn vị đang dùng')}</div><div class="panel table-panel"><div class="table-header"><div><div class="table-title">Danh sách mặt hàng đang kinh doanh</div><div class="table-sub">Số lượng tồn và tình trạng hàng chỉ hiển thị trong phân hệ Kho</div></div>${btn('Xem tồn kho '+ic('arrow',15),'nav:inventory','btn-sm')}</div>${toolbar({search:'Tìm mã, tên, nhóm, quy cách, nơi nhập...',filterOptions:[['all','Tất cả nhóm hàng'],...groups.map(x=>[x,x])],exportKey:'products'})}${productTable(list)}${footer(list.length)}</div>`}
function inventoryOverview(){const p=data.products;const list=filtered(p,{filter:x=>stockStatus(x)[0],search:x=>x.name+' '+x.id+' '+x.category});return `<div class="metrics">${metric('Mặt hàng trong kho',p.length,'box','green','Không cộng số lượng khác đơn vị')}${metric('Mặt hàng còn hàng',p.filter(x=>x.stock>x.min).length,'layers','blue')}${metric('Sắp hết hàng',p.filter(x=>x.stock<=x.min&&x.stock>0).length,'alert','orange')}${metric('Hết hàng',p.filter(x=>x.stock<=0).length,'clock','purple')}</div><div class="detail-layout"><div class="panel table-panel"><div class="table-header"><div><div class="table-title">Tồn kho hiện tại</div><div class="table-sub">Số lượng, ngưỡng cảnh báo và trạng thái · dữ liệu mẫu</div></div>${btn(ic('download',15)+' Xuất CSV','export:inventory','btn-sm')}</div>${toolbar({search:'Tìm mã hoặc tên hàng trong kho...',filterOptions:[['all','Tất cả tình trạng'],['Còn hàng','Còn hàng'],['Sắp hết','Sắp hết'],['Hết hàng','Hết hàng']]})}${inventoryTable(list)}${footer(list.length)}</div><div class="inventory-side"><div class="panel aside-card"><div class="r-between"><div class="aside-title" style="margin:0">Biến động kho gần đây</div><button data-tab="in" class="inline-link">Xem phiếu</button></div><div class="v-space"></div>${data.movements.slice(0,5).map(m=>`<div class="alert-item"><div class="movement-icon">${ic(m.kind==='Nhập kho'?'download':'upload',17)}</div><div class="alert-item-main"><strong>${e(m.kind)} ${e(m.id)}</strong><small>${e(product(m.productId).name)} · ${dmy(m.date)}</small></div><strong class="${m.kind==='Nhập kho'?'amount-in':'amount-out'}">${m.kind==='Nhập kho'?'+':'−'}${number(m.qty)}</strong></div>`).join('')}</div><div class="panel aside-card"><div class="aside-title">Tồn kho cần chú ý</div>${p.filter(x=>x.stock<=x.min).slice(0,5).map(x=>`<div style="margin-bottom:15px"><div class="r-between"><span style="font-size:11px">${e(x.name)}</span><b style="font-size:10px;color:#b47a32">Tồn: ${number(x.stock)} ${e(x.unit)}</b></div></div>`).join('')}</div></div></div>`}
function inventoryDocs(kind){let rows=data.movements.filter(m=>kind==='in'?m.kind==='Nhập kho':m.kind==='Xuất kho');rows=filtered(rows,{filter:x=>x.kind,search:x=>x.id+' '+x.note+' '+product(x.productId).name});return `<div class="panel table-panel"><div class="table-header"><div><div class="table-title">Danh sách phiếu ${kind==='in'?'nhập':'xuất'} kho</div><div class="table-sub">Phiếu mẫu được tạo độc lập với chứng từ mua bán</div></div>${btn(ic('plus',15)+` Thêm phiếu ${kind==='in'?'nhập':'xuất'}`,'new:movement:'+kind,'btn-primary')}</div>${toolbar({search:'Tìm số phiếu, mặt hàng...',exportKey:'movements'})}${tableWrap(['MÃ PHIẾU','NGÀY','MẶT HÀNG','SỐ LƯỢNG','DIỄN GIẢI',''],rows.map(m=>`<tr><td><span class="table-cell-link" data-action="detail:movement:${m.id}">${m.id}</span></td><td>${dmy(m.date)}</td><td>${e(product(m.productId).name)}</td><td>${m.qty} ${e(product(m.productId).unit)}</td><td>${e(m.note)}</td><td>${btn(ic('right',14),'detail:movement:'+m.id,'btn-icon btn-ghost btn-sm')}</td></tr>`).join(''))}${footer(rows.length)}</div><p class="report-footnote">Chưa gắn thao tác xác nhận phiếu với thay đổi tồn kho. Luồng này sẽ chốt với kế toán/kho ở giai đoạn tiếp theo.</p>`}
function inventoryChecks(){return `<div class="panel table-panel"><div class="table-header"><div><div class="table-title">Phiếu kiểm kê</div><div class="table-sub">Xem trước layout kiểm kê; chưa có tính toán chênh lệch thực tế</div></div>${btn(ic('plus',15)+' Tạo phiếu kiểm kê','new:check','btn-primary')}</div>${tableWrap(['SỐ PHIẾU','NGÀY TẠO','TRẠNG THÁI','GHI CHÚ',''],data.stockChecks.map(x=>`<tr><td>${x.id}</td><td>${dmy(x.date)}</td><td>${badge(x.status,'orange')}</td><td>${e(x.note)}</td><td>${btn('Xem','detail:check:'+x.id,'btn-sm')}</td></tr>`).join(''))}${footer(data.stockChecks.length)}</div>`}
function pageInventory(){if(!['overview','in','out','check'].includes(state.tab))state.tab='overview';return header('Quản lý kho','Theo dõi tồn kho và biểu mẫu nhập, xuất, kiểm kê')+tabs([['overview','Tổng quan tồn kho'],['in','Nhập kho'],['out','Xuất kho'],['check','Kiểm kê']],state.tab)+({overview:inventoryOverview,in:()=>inventoryDocs('in'),out:()=>inventoryDocs('out'),check:inventoryChecks}[state.tab]())}
function documentPage(kind){const purchase=kind==='purchases',items=data[kind],names=purchase?['Chứng từ mua','Nhận hóa đơn']:['Chứng từ bán','Hóa đơn'];const initial=purchase?'docs':'docs';if(!['docs','invoices'].includes(state.tab))state.tab=initial;let h=header(purchase?'Mua hàng':'Bán hàng',purchase?'Xem chứng từ mua hàng và hóa đơn do nhà cung cấp gửi':'Xem chứng từ bán hàng và thông tin hóa đơn đầu ra');h+=tabs([['docs',names[0]],['invoices',names[1]]],state.tab);return h+(state.tab==='docs'?documentList(kind):invoiceList(kind));}
function documentList(kind){const purchase=kind==='purchases';let rows=filtered(data[kind],{filter:x=>x.status,search:x=>x.id+' '+partner(x.partnerId)+' '+x.note+' '+(purchase?invNumForPurchase(x.id):invNumForSale(x.id))});return `<div class="metrics">${metric('Số chứng từ mẫu',data[kind].length,'file','green')}${metric('Chứng từ đã lưu',data[kind].filter(x=>x.status==='Đã lưu').length,'filecheck','blue')}${metric('Chứng từ bản nháp',data[kind].filter(x=>x.status==='Bản nháp').length,'clock','orange')}${metric('Có thông tin hóa đơn',data[kind].filter(x=>purchase?invNumForPurchase(x.id)!=='—':invNumForSale(x.id)!=='—').length,'receipt','purple')}</div><div class="panel table-panel"><div class="table-header"><div><div class="table-title">Danh sách chứng từ ${purchase?'mua':'bán'}</div><div class="table-sub">Chọn dòng để xem hoặc sửa thông tin trên bản demo</div></div>${btn(ic('plus',15)+' Thêm chứng từ '+(purchase?'mua':'bán'),'new:document:'+kind,'btn-primary')}</div>${toolbar({search:'Tìm số chứng từ, đối tác, số hóa đơn...',filterOptions:[['all','Tất cả trạng thái'],['Đã lưu','Đã lưu'],['Bản nháp','Bản nháp']],exportKey:kind})}${tableWrap(['NGÀY','SỐ CHỨNG TỪ',purchase?'NHÀ CUNG CẤP':'KHÁCH HÀNG','GIÁ TRỊ HÀNG MẪU','SỐ HÓA ĐƠN','TRẠNG THÁI',''],rows.map(o=>`<tr><td>${dmy(o.date)}</td><td><span class="table-cell-link" data-action="detail:document:${kind}:${o.id}">${e(o.id)}</span></td><td><strong>${e(partner(o.partnerId))}</strong></td><td>${money(total(o))}</td><td>${e(purchase?invNumForPurchase(o.id):invNumForSale(o.id))}</td><td>${badge(o.status,o.status==='Đã lưu'?'green':'orange')}</td><td>${btn(ic('dots',16),'detail:document:'+kind+':'+o.id,'btn-icon btn-ghost btn-sm')}</td></tr>`).join(''))}${footer(rows.length)}</div><p class="report-footnote">Các giá trị thành tiền = số lượng × đơn giá chỉ để mô phỏng form. Không tự động ghi sổ, nhập/xuất kho hoặc xử lý thuế.</p>`}
function invoiceList(kind){const purchase=kind==='purchases',invoices=purchase?data.purchaseInvoices:data.saleInvoices;let rows=filtered(invoices,{filter:x=>x.status||'Đã ghi nhận mẫu',search:x=>x.number+' '+x.series+' '+partner(x.partnerId)+' '+(x.purchaseId||x.saleId)});return `<div class="metrics">${metric('Số hóa đơn mẫu',invoices.length,'receipt','green')}${metric(purchase?'Chứng từ chưa liên kết hóa đơn':'Chứng từ chưa gắn hóa đơn',data[kind].filter(x=>purchase?invNumForPurchase(x.id)==='—':invNumForSale(x.id)==='—').length,'alert','orange')}${metric('Đang xem','Hóa đơn '+(purchase?'đầu vào':'đầu ra'),'file','blue')}${metric('Trạng thái bản demo','Chưa tích hợp','layers','purple','Chưa phát hành/nhận HĐĐT thật')}</div><div class="panel table-panel"><div class="table-header"><div><div class="table-title">${purchase?'Hóa đơn mua hàng đã ghi nhận':'Hóa đơn bán hàng'}</div><div class="table-sub">Thông tin hóa đơn mẫu, không có chức năng phát hành hay kết nối cơ quan thuế</div></div>${btn(ic('plus',15)+(purchase?' Nhận hóa đơn':' Thêm hóa đơn'),'new:invoice:'+kind,'btn-primary')}</div>${toolbar({search:'Tìm số hóa đơn, đối tác, chứng từ...',exportKey:purchase?'purchaseInvoices':'saleInvoices'})}${tableWrap(['NGÀY HÓA ĐƠN','SỐ HÓA ĐƠN','KÝ HIỆU',purchase?'NHÀ CUNG CẤP':'KHÁCH HÀNG','CHỨNG TỪ LIÊN KẾT','TRẠNG THÁI',''],rows.map(x=>`<tr><td>${dmy(x.date)}</td><td><span class="table-cell-link" data-action="detail:invoice:${kind}:${x.id}">${e(x.number)}</span></td><td>${e(x.series)}</td><td>${e(partner(x.partnerId))}</td><td>${e(x.purchaseId||x.saleId||'—')}</td><td>${badge(x.status||'Đã ghi nhận mẫu',x.status?'orange':'green')}</td><td>${btn(ic('dots',16),'detail:invoice:'+kind+':'+x.id,'btn-icon btn-ghost btn-sm')}</td></tr>`).join(''))}${footer(rows.length)}</div>${purchase?`<div class="hint" style="margin-top:14px">${ic('info',15)} <strong>Luồng thử:</strong> Bấm “Nhận hóa đơn” → chọn chứng từ mua chưa có hóa đơn → nhập số, ký hiệu, ngày hóa đơn → lưu bản mẫu → kiểm tra cột số hóa đơn tại danh sách chứng từ mua.</div>`:`<div class="hint" style="margin-top:14px">${ic('info',15)} <strong>Hóa đơn đầu ra:</strong> Form chỉ ghi lại thông tin mẫu. Nút lưu không phát hành hóa đơn điện tử thật.</div>`}`}
function pagePartners(){if(!['customer','supplier'].includes(state.partnerKind))state.partnerKind='customer';const kind=state.partnerKind;const list=data.partners.filter(p=>p.kind===kind&&(p.id+' '+p.name+' '+p.phone).toLowerCase().includes(state.search.toLowerCase()));return header('Đối tác','Danh sách khách hàng và nhà cung cấp minh họa',btn(ic('plus',15)+' Thêm '+(kind==='customer'?'khách hàng':'nhà cung cấp'),'new:partner','btn-primary'))+tabs([['customer','Khách hàng'],['supplier','Nhà cung cấp']],kind,'partnerkind')+`<div class="panel table-panel">${toolbar({search:'Tìm tên, mã hoặc số điện thoại...',exportKey:'partners'})}${tableWrap(['MÃ ĐỐI TÁC','TÊN ĐỐI TÁC','SỐ ĐIỆN THOẠI','ĐỊA CHỈ','MÃ SỐ THUẾ',''],list.map(x=>`<tr><td><span class="table-cell-link" data-action="detail:partner:${x.id}">${e(x.id)}</span></td><td><strong>${e(x.name)}</strong></td><td>${e(x.phone)}</td><td>${e(x.address)}</td><td>${e(x.taxCode||'—')}</td><td>${btn(ic('edit',15),'edit:partner:'+x.id,'btn-icon btn-ghost btn-sm')}</td></tr>`).join(''))}${footer(list.length)}</div>`}
function pageReports(){const tab=state.reportTab;const links=[['sales','Mua & bán'],['inventory','Tồn kho'],['custom','Báo cáo khác']];let body='';if(tab==='sales'){const docs=reportRows();const sellers=bestSellers();const top=sellers[0]?.qty||1;body=`<div class="metrics">${metric('Giá trị bán hàng (mẫu)','125.000.000 ₫','chart','green')}${metric('Giá trị mua hàng (mẫu)','82.000.000 ₫','cart','orange')}${metric('Số chứng từ bán',data.sales.length,'filecheck','blue')}${metric('Số chứng từ mua',data.purchases.length,'file','purple')}</div><div class="twocol"><div class="panel"><div class="panel-head"><div><h2>Giá trị mua và bán theo tháng</h2><p>Biểu đồ tĩnh – chưa xác nhận công thức kế toán</p></div></div><div class="panel-body">${chart()}</div></div><div class="panel aside-card"><h2 style="font-size:15px;margin:0 0 14px">Top mặt hàng bán chạy (mẫu)</h2>${sellers.map((x,i)=>`<div class="statline"><label>${e(product(x.id).name)}</label><div class="statline-bar"><i style="width:${x.qty/top*100}%"></i></div><span>${number(x.qty)}</span></div>`).join('')||'<div class="empty-note">Chưa có chứng từ bán</div>'}</div></div><div class="panel table-panel"><div class="table-header"><div><div class="table-title">Danh sách giao dịch mua – bán</div><div class="table-sub">Mỗi dòng là một chứng từ, có nhãn MUA hoặc BÁN rõ ràng</div></div>${btn(ic('download',15)+' Xuất CSV','export:reports','btn-sm')}</div><div class="report-filters"><div class="report-type-buttons">${[['all','Tất cả'],['buy','Đơn mua'],['sell','Đơn bán']].map(([key,label])=>`<button class="btn btn-sm ${state.reportDocKind===key?'report-kind-active':''}" data-report-kind="${key}">${label}</button>`).join('')}</div><input class="field report-search" placeholder="Tìm mã chứng từ, đối tác, mặt hàng..." value="${e(state.reportSearch)}" data-report-search aria-label="Tìm giao dịch mua bán"/></div>${tableWrap(['LOẠI','NGÀY','SỐ CHỨNG TỪ','ĐỐI TÁC','MẶT HÀNG / NỘI DUNG','TỔNG TIỀN MẪU','TRẠNG THÁI'],docs.map(x=>`<tr><td>${badge(x.kind,x.kindKey==='buy'?'blue':'green')}</td><td>${dmy(x.date)}</td><td><span class="table-cell-link" data-action="detail:document:${x.kindKey==='buy'?'purchases':'sales'}:${e(x.id)}">${e(x.id)}</span></td><td>${e(partner(x.partnerId))}</td><td class="cell-wrap">${e(x.items.map(it=>product(it.productId).name).join(', '))}</td><td><strong>${money(total(x))}</strong></td><td>${badge(x.status,x.status==='Bản nháp'?'orange':'gray')}</td></tr>`).join(''))}${footer(docs.length)}</div>`}else if(tab==='inventory'){body=`<div class="metrics">${metric('Số mặt hàng',data.products.length,'box','green')}${metric('Sắp hết hàng',data.products.filter(p=>p.stock<=p.min&&p.stock>0).length,'alert','orange')}${metric('Hết hàng',data.products.filter(p=>p.stock===0).length,'clock','blue')}${metric('Kho minh họa','Kho chính','warehouse','purple')}</div><div class="panel table-panel"><div class="table-header"><div><div class="table-title">Báo cáo tồn kho theo mặt hàng</div><div class="table-sub">Số tồn cố định để thử bố cục báo cáo</div></div>${btn(ic('download',15)+' CSV','export:inventory','btn-sm')}</div>${inventoryTable(data.products)}${footer(data.products.length)}</div>`}else{body=`<div class="notice-panel">${ic('alert',20)}<div><strong>Chưa chốt chỉ tiêu báo cáo kế toán</strong><div>Chưa triển khai công nợ, lợi nhuận, giá vốn hoặc báo cáo thuế. Sẽ bổ sung sau buổi review với kế toán.</div></div></div><div style="margin-top:16px" class="panel aside-card"><div class="aside-title">Nội dung cần kế toán xác nhận</div><div class="listbox">${['Cần mẫu báo cáo đang sử dụng thực tế?','Báo cáo theo ngày, tháng hay khoảng thời gian tùy chọn?','Cần nhóm theo đối tác, kho, mặt hàng hay theo chứng từ?','Cách tính từng chỉ tiêu và điều kiện lọc?'].map((x,i)=>`<div class="listbox-item"><span class="partner-pill">${i+1}</span><span>${e(x)}</span></div>`).join('')}</div></div>`}return header('Báo cáo','Xem các màn hình thống kê dùng dữ liệu minh họa, chưa xử lý kế toán')+`<div class="panel" style="padding:12px 14px;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div class="reports-tabs" style="margin:0;flex:1">${links.map(([id,label])=>`<button data-report="${id}" class="btn ${id===tab?'is-active':''}">${e(label)}</button>`).join('')}</div><span class="note-tag">Dữ liệu mẫu – tháng 10/2026</span></div>`+body+`<p class="report-footnote">Số liệu và công thức chỉ phục vụ duyệt giao diện. Bảng giao dịch lấy từ chứng từ demo, riêng biểu đồ và KPI sử dụng số tổng hợp minh họa.</p>`}
function pageSettings(){return header('Thiết lập bản demo','Quản lý dữ liệu mẫu và xem giới hạn của phiên bản prototype')+`<div class="twocol"><div class="panel aside-card"><h2 style="margin:0 0 16px;font-size:16px">Trạng thái prototype</h2><div class="detail-list"><div class="detail-row"><span>Phiên bản</span><strong>Foodland UI Prototype 2.0</strong></div><div class="detail-row"><span>Dữ liệu</span><strong>LocalStorage trên trình duyệt</strong></div><div class="detail-row"><span>Frontend</span><strong>HTML + CSS + JavaScript (demo độc lập)</strong></div><div class="detail-row"><span>Backend / API</span><strong>Chưa triển khai</strong></div><div class="detail-row"><span>Kế toán / Thuế</span><strong>Chưa xử lý</strong></div><div class="detail-row"><span>Tổng mặt hàng</span><strong>${data.products.length}</strong></div><div class="detail-row"><span>Chứng từ demo</span><strong>${data.purchases.length+data.sales.length}</strong></div></div><div class="separator"></div>${btn(ic('refresh',15)+' Khôi phục dữ liệu mẫu ban đầu','reset','btn-danger')}</div><div class="panel aside-card"><h2 style="margin:0 0 13px;font-size:16px">Cách thử bản demo</h2><div class="listbox">${['Vào Hàng hóa → thêm sản phẩm, quy cách và nguồn nhập.','Vào Kho → chỉnh tồn mẫu rồi kiểm tra trạng thái; qua Mua hàng tạo chứng từ.','Vào Mua hàng → Nhận hóa đơn → chọn chứng từ chưa có hóa đơn → nhập và lưu.','Quay về Chứng từ mua để thấy số hóa đơn được liên kết.','Vào Bán hàng → Hóa đơn → chọn chứng từ bán → lưu bản ghi hóa đơn mẫu.','Vào Báo cáo → lọc riêng Đơn mua / Đơn bán → tải CSV.'].map((x,i)=>`<div class="listbox-item"><span class="partner-pill">${i+1}</span><span style="flex:1;font-size:12px">${e(x)}</span></div>`).join('')}</div></div></div><div class="notice-panel">${ic('info',20)} Các thay đổi chỉ lưu trên trình duyệt này. Không sử dụng hóa đơn và báo cáo trong bản demo cho hoạt động kế toán thật.</div>`}
function currentPage(){switch(state.page){case 'dashboard':return pageDashboard();case 'products':return pageProducts();case 'inventory':return pageInventory();case 'purchases':return documentPage('purchases');case 'sales':return documentPage('sales');case 'partners':return pagePartners();case 'reports':return pageReports();case 'settings':return pageSettings();default:return pageDashboard()}}
function render(){document.getElementById('app').innerHTML=mainShell();renderPage();renderModal()}
function renderPage(){let el=document.getElementById('page-content');if(!el)return;let y=window.scrollY;el.innerHTML=currentPage();window.scrollTo(0,y)}
function goto(page){state.page=page;state.tab=page==='inventory'?'overview':'docs';state.search='';state.filter='all';state.modal=null;window.scrollTo(0,0);render();}
function switchTab(tab){state.tab=tab;state.search='';state.filter='all';renderPage();}
function toast(message){let root=document.getElementById('toast-root');root.innerHTML+=`<div class="toast">${ic('check',17)}<span>${e(message)}</span></div>`;setTimeout(()=>{root.firstElementChild?.remove()},4300)}
function modalLayout(title,subtitle,body,foot='',kind='modal',wide=false){return kind==='drawer'?`<div class="drawer-overlay" data-backdrop="1"><section class="drawer"><div class="modal-head"><div><h2>${e(title)}</h2><p>${e(subtitle)}</p></div><button class="close-btn" data-action="close" aria-label="Đóng">${ic('close',20)}</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></section></div>`:`<div class="overlay" data-backdrop="1"><section class="modal ${wide?'wide':''}"><div class="modal-head"><div><h2>${e(title)}</h2><p>${e(subtitle)}</p></div><button class="close-btn" data-action="close" aria-label="Đóng">${ic('close',20)}</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></section></div>`}
const field=(name,label,value='',opts={})=>`<div class="form-group ${opts.span?'span-'+opts.span:''}"><label for="form-${name}">${e(label)}${opts.required?' <em>*</em>':''}</label>${opts.options?`<select class="form-control" id="form-${name}" name="${name}" ${opts.required?'required':''}>${opts.options}</select>`:opts.type==='textarea'?`<textarea class="form-control" id="form-${name}" name="${name}" placeholder="${e(opts.placeholder||'')}">${e(value)}</textarea>`:`<input class="form-control" id="form-${name}" name="${name}" type="${opts.type||'text'}" value="${e(value)}" placeholder="${e(opts.placeholder||'')}" ${opts.required?'required':''} ${opts.min!=null?'min="'+opts.min+'"':''}/>`}</div>`;
const opt=(list,selected)=>list.map(x=>`<option value="${e(x)}" ${x===selected?'selected':''}>${e(x)}</option>`).join('');
const formFoot=(submitLabel='Lưu mẫu')=>`${btn('Hủy','close') }<button class="btn btn-primary" type="submit" form="active-form">${ic('check',15)} ${e(submitLabel)}</button>`;
function productForm(id){const p=data.products.find(x=>x.id===id)||null;return modalLayout(p?'Sửa mặt hàng':'Thêm hàng hóa','Chỉ quản lý thông tin danh mục; dữ liệu tồn kho chỉnh tại phân hệ Kho',`<form id="active-form" data-form="product" class="form-grid"><input type="hidden" name="oldId" value="${e(p?.id||'')}"/>${field('id','Mã hàng hóa',p?.id||'SP'+String(data.products.length+1).padStart(4,'0'),{span:4,required:true})}${field('name','Tên hàng hóa',p?.name||'',{span:8,required:true})}${field('category','Nhóm hàng',p?.category||'Đồ uống',{span:4,options:opt(['Đồ uống','Bánh kẹo','Thực phẩm tươi','Thực phẩm khô','Gia vị','Khác'],p?.category||'Đồ uống')})}${field('unit','Đơn vị tính',p?.unit||'Hộp',{span:4,options:opt(['Hộp','Gói','Kg','Thùng','Chai','Túi','Cái'],p?.unit||'Hộp')})}${field('price','Giá tham khảo (₫)',p?.price||0,{span:4,type:'number',min:0})}${field('spec','Quy cách / thông số',p?.spec||'',{span:6,placeholder:'Ví dụ: 48 hộp/thùng, 180ml/hộp'})}${field('supplierId','Nguồn nhập / nhà cung cấp',p?.supplierId||'',{span:6,options:'<option value="">Chưa xác định</option>'+partnerOptions('supplier',p?.supplierId||'').replace('<option value="">Chọn nhà cung cấp</option>','')})}${field('note','Ghi chú sản phẩm',p?.note||'',{span:12,type:'textarea'})}</form>`,formFoot('Lưu mặt hàng'))}
function stockForm(id){const p=data.products.find(x=>x.id===id);if(!p)return'';return modalLayout('Chỉnh tồn kho mẫu','Chỉ điều chỉnh dữ liệu giả lập để duyệt giao diện, chưa tạo phiếu nghiệp vụ',`<div class="notice-panel">${ic('info',18)}<span><strong>${e(p.id)} — ${e(p.name)}</strong><br/>Thông tin danh mục sửa tại trang Hàng hóa. Số lượng và tình trạng được quản lý tại trang Kho.</span></div><form id="active-form" data-form="stock" class="form-grid" style="margin-top:16px"><input type="hidden" name="productId" value="${e(p.id)}"/>${field('stock','Số lượng tồn mẫu',p.stock,{span:6,type:'number',min:0,required:true})}${field('min','Ngưỡng cảnh báo tồn thấp',p.min,{span:6,type:'number',min:0,required:true})}</form>`,formFoot('Lưu tồn mẫu'))}
function partnerForm(id){const x=data.partners.find(x=>x.id===id);let kind=x?.kind||state.partnerKind;return modalLayout(x?'Sửa thông tin đối tác':'Thêm đối tác','Thông tin minh họa cho danh sách lựa chọn trong form',`<form id="active-form" data-form="partner" class="form-grid"><input type="hidden" name="oldId" value="${e(x?.id||'')}"/><input type="hidden" name="kind" value="${kind}"/>${field('id','Mã đối tác',x?.id||((kind==='customer'?'KH':'NCC')+String(data.partners.length+1).padStart(3,'0')),{span:4,required:true})}${field('name','Tên đối tác',x?.name||'',{span:8,required:true})}${field('phone','Số điện thoại',x?.phone||'',{span:4})}${field('taxCode','Mã số thuế (nếu có)',x?.taxCode||'',{span:4})}${field('address','Địa chỉ',x?.address||'',{span:12})}</form>`,formFoot('Lưu đối tác'))}
function lineEntry(item={},i=0){const p=product(item.productId||data.products[0]?.id);return `<tr class="entry-line"><td style="color:#a0aea4">${i+1}</td><td><select class="line-entry line-product" aria-label="Mặt hàng"><option value="">Chọn mặt hàng...</option>${productOptions(item.productId||'')}</select></td><td><span class="unit-value">${e(item.productId?p.unit:'—')}</span></td><td><input class="line-entry line-qty" type="number" min="0.01" step="0.01" aria-label="Số lượng" value="${e(item.qty||1)}"/></td><td><input class="line-entry line-price" type="number" min="0" step="1" aria-label="Đơn giá" value="${e(item.price??(item.productId?p.price:0))}"/></td><td style="text-align:right"><strong class="line-total">${money((+item.qty||1)*(+item.price||0))}</strong></td><td>${btn(ic('trash',14),'remove-line','btn-icon btn-ghost btn-sm')}</td></tr>`}
function rowsEditor(items){return `<div class="table-scroll"><table class="entry-table"><thead><tr><th>#</th><th style="min-width:270px">MẶT HÀNG</th><th>ĐƠN VỊ</th><th style="min-width:110px">SỐ LƯỢNG</th><th style="min-width:145px">ĐƠN GIÁ (₫)</th><th>THÀNH TIỀN</th><th></th></tr></thead><tbody id="entry-rows">${items.map((x,i)=>lineEntry(x,i)).join('')}</tbody></table></div><div class="entry-footer">${btn(ic('plus',15)+' Thêm dòng','add-line','btn-sm')}<div class="total-box"><div class="total-row"><span>Tổng tiền hàng (minh họa)</span><strong id="entry-grand">${money(items.reduce((s,x)=>s+(+x.qty||0)*(+x.price||0),0))}</strong></div><div style="font-size:10px;color:#7a9985;margin-top:6px">Chỉ cộng số lượng × đơn giá, chưa tính thuế, chiết khấu</div></div></div>`}
function docForm(kind,id){let purchase=kind==='purchases';const x=data[kind].find(x=>x.id===id);let pItems=x?.items||[{productId:'SP0001',qty:10,price:8000}];let title=(x?'Chỉnh sửa ':'Tạo ')+(purchase?'chứng từ mua':'chứng từ bán');return modalLayout(title,'Giao diện tương tác dùng để lấy ý kiến kế toán, không ghi nhận nghiệp vụ thật',`<form id="active-form" data-form="document" data-kind="${kind}" class="form-shell"><input type="hidden" name="oldId" value="${e(x?.id||'')}"/><div class="panel form-panel" style="box-shadow:none"><div class="form-panel-title"><span class="small-icon">${ic('file',19)}</span>Thông tin chung</div><div class="form-grid">${field('partnerId',purchase?'Nhà cung cấp':'Khách hàng',x?.partnerId||'',{span:6,required:true,options:partnerOptions(purchase?'supplier':'customer',x?.partnerId)})}${field('date','Ngày chứng từ',x?.date||today,{span:3,type:'date',required:true})}${field('id','Số chứng từ',x?.id||(purchase?'NK':'BH')+String(data[kind].length+1).padStart(5,'0'),{span:3,required:true})}${field('note','Diễn giải / Ghi chú',x?.note||'',{span:12,type:'textarea',placeholder:'Nội dung mô phỏng...'})}</div></div><div class="panel form-panel" style="box-shadow:none"><div class="form-panel-title"><span class="small-icon">${ic('box',19)}</span>Hàng hóa</div>${rowsEditor(pItems)}</div><div class="hint">${ic('info',16)} Lưu chứng từ trong bản demo <strong>không cập nhật tồn kho, công nợ, thuế hoặc báo cáo</strong>. Các luồng đó sẽ hỏi lại kế toán.</div></form>`,formFoot('Lưu chứng từ mẫu'),'modal',true)}
function receiptPicker(kind='purchases'){const purchase=kind==='purchases';const docs=data[kind].filter(x=>purchase?!data.purchaseInvoices.some(i=>i.purchaseId===x.id):!data.saleInvoices.some(i=>i.saleId===x.id));const f=state.receiptFilters;const choices=docs.filter(x=>(f.supplier==='all'||x.partnerId===f.supplier)&&(!f.from||x.date>=f.from)&&(!f.to||x.date<=f.to)&&(!f.search||(x.id+' '+partner(x.partnerId)+' '+x.note+' '+x.items.map(it=>product(it.productId).name).join(' ')).toLowerCase().includes(f.search.toLowerCase())));const title=purchase?'Chọn chứng từ mua cần nhận hóa đơn':'Chọn chứng từ bán để lập hóa đơn';return modalLayout(title,'Chọn chứng từ từ bảng đầy đủ thông tin trước khi mở form hóa đơn',`<div class="picker-controls"><div class="form-group"><label>${purchase?'Nhà cung cấp':'Khách hàng'}</label><select class="form-control" id="picker-supplier"><option value="all">Tất cả ${purchase?'nhà cung cấp':'khách hàng'}</option>${data.partners.filter(x=>x.kind===(purchase?'supplier':'customer')).map(x=>`<option value="${e(x.id)}" ${f.supplier===x.id?'selected':''}>${e(x.name)}</option>`).join('')}</select></div><div class="form-group"><label>Từ ngày</label><input type="date" class="form-control" id="picker-from" value="${e(f.from)}"/></div><div class="form-group"><label>Đến ngày</label><input type="date" class="form-control" id="picker-to" value="${e(f.to)}"/></div>${btn(ic('search',14)+' Lấy dữ liệu','picker-load','btn-primary')}</div><div class="picker-search-row"><input id="picker-search" class="field" placeholder="Tìm số chứng từ, đối tác, diễn giải, mặt hàng..." value="${e(f.search)}"/><span class="muted">${choices.length} chứng từ phù hợp</span></div>${tableWrap(['CHỌN','NGÀY','SỐ CHỨNG TỪ',purchase?'NHÀ CUNG CẤP':'KHÁCH HÀNG','DIỄN GIẢI / MẶT HÀNG','TỔNG TIỀN'],choices.map(x=>`<tr class="select-row ${state.selectedReceipt===x.id?'selected':''}" data-select-receipt="${e(x.id)}"><td><input type="radio" name="receipt" class="check" ${state.selectedReceipt===x.id?'checked':''}/></td><td>${dmy(x.date)}</td><td><strong>${e(x.id)}</strong></td><td>${e(partner(x.partnerId))}</td><td class="cell-wrap">${e(x.note||x.items.map(it=>product(it.productId).name).join(', '))}</td><td><strong>${money(total(x))}</strong></td></tr>`).join(''),'Không có chứng từ chưa gắn hóa đơn phù hợp bộ lọc')}`,btn('Hủy','close')+btn('Tiếp tục '+ic('arrow',15),'receipt-continue','btn-primary',state.selectedReceipt?'':'disabled'),'drawer')}
function invoiceForm(kind){const purchase=kind==='purchases';const ref=data[kind].find(x=>x.id===state.selectedReceipt);if(!ref)return receiptPicker(kind);const supplier=data.partners.find(x=>x.id===ref.partnerId);return modalLayout(purchase?'Nhận hóa đơn đầu vào':'Thêm hóa đơn bán hàng',purchase?'Ghi thông tin hóa đơn do nhà cung cấp gửi (mẫu)':'Ghi thông tin hóa đơn đầu ra (mẫu, chưa phát hành)',`<form id="active-form" data-form="invoice" data-kind="${kind}" class="form-shell"><input name="refId" type="hidden" value="${e(ref.id)}"/><input name="partnerId" type="hidden" value="${e(ref.partnerId)}"/><div class="panel form-panel" style="box-shadow:none"><div class="form-panel-title"><span class="small-icon">${ic('filecheck',19)}</span>Chứng từ liên kết <span class="form-head-note">${btn(ic('search',14)+' Đổi chứng từ','change-receipt','btn-sm')}</span></div><div class="linked-doc"><div><small>SỐ CHỨNG TỪ</small><strong>${e(ref.id)}</strong></div><div><small>NGÀY CHỨNG TỪ</small><strong>${dmy(ref.date)}</strong></div><div><small>${purchase?'NHÀ CUNG CẤP':'KHÁCH HÀNG'}</small><strong>${e(partner(ref.partnerId))}</strong></div><div><small>GIÁ TRỊ MẪU</small><strong>${money(total(ref))}</strong></div></div><div class="linked-items">${e(ref.items.map(it=>product(it.productId).name+' × '+number(it.qty)).join(' · '))}</div></div><div class="panel form-panel" style="box-shadow:none"><div class="form-panel-title"><span class="small-icon">${ic('receipt',19)}</span>Thông tin hóa đơn</div><div class="form-grid">${field('invoiceType','Loại hóa đơn','Hóa đơn bán hàng hóa, dịch vụ',{span:6,options:opt(['Hóa đơn bán hàng hóa, dịch vụ','Hóa đơn GTGT'], 'Hóa đơn bán hàng hóa, dịch vụ')})}${field('date','Ngày hóa đơn',today,{span:3,required:true,type:'date'})}${field('number','Số hóa đơn','',{span:3,required:true,placeholder:'Ví dụ: 0000123'})}${field('series','Ký hiệu hóa đơn','1C26TAA',{span:4})}${field('template','Mẫu số hóa đơn','1',{span:4})}${field('paymentMethod','Hình thức thanh toán','TM/CK',{span:4,options:opt(['TM/CK','Tiền mặt','Chuyển khoản'],'TM/CK')})}<div class="form-group span-6"><label>${purchase?'Nhà cung cấp':'Khách hàng'} (theo chứng từ)</label><div class="form-control readonly-look">${e(partner(ref.partnerId))}</div></div>${field('taxCode','Mã số thuế (tham khảo)',supplier?.taxCode||'',{span:6})}${field('address','Địa chỉ (tham khảo)',supplier?.address||'',{span:12})}${field('note','Ghi chú',purchase?'Nhận hóa đơn liên kết chứng từ '+ref.id:'Hóa đơn mẫu liên kết chứng từ '+ref.id,{span:12,type:'textarea'})}</div></div><div class="notice-panel">${ic('alert',18)} <div>Hai form mua và bán dùng chung bố cục. Bản demo không tạo hóa đơn điện tử thật, không kiểm tra thuế và không ghi nhận công nợ.</div></div></form>`,formFoot(purchase?'Lưu hóa đơn nhận mẫu':'Lưu hóa đơn bán mẫu'),'modal',true)}
function movementForm(kind){let incoming=kind==='in';return modalLayout(incoming?'Tạo phiếu nhập kho mẫu':'Tạo phiếu xuất kho mẫu','Phiếu minh họa – chưa tác động tới số tồn hiển thị',`<form id="active-form" data-form="movement" data-kind="${kind}" class="form-grid">${field('date','Ngày phiếu',today,{span:4,type:'date',required:true})}${field('id','Mã phiếu',(incoming?'PN':'PX')+String(data.movements.length+1).padStart(4,'0'),{span:4,required:true})}${field('productId','Mặt hàng','',{span:12,required:true,options:'<option value="">Chọn mặt hàng...</option>'+productOptions()})}${field('qty','Số lượng',1,{span:4,type:'number',required:true,min:0.01})}${field('note','Ghi chú',incoming?'Phiếu nhập thử':'Phiếu xuất thử',{span:12,type:'textarea'})}</form>`,formFoot('Lưu phiếu mẫu'))}
function checkForm(){return modalLayout('Tạo phiếu kiểm kê mẫu','Bản nháp phục vụ duyệt giao diện',`<form id="active-form" data-form="check" class="form-grid">${field('date','Ngày kiểm kê',today,{span:6,type:'date'})}${field('note','Ghi chú','Kiểm kê thử tại kho chính',{span:12,type:'textarea'})}</form>`,formFoot('Tạo phiếu mẫu'))}
function detailModal(parts){let [type,kind,id]=parts;if(type==='product'){let p=data.products.find(x=>x.id===kind);if(!p)return'';return modalLayout('Chi tiết hàng hóa','Thông tin mặt hàng đang kinh doanh – không hiển thị tồn kho',`<div class="product-detail-head"><div class="sku-chip">${e(p.id)}</div><div><h3>${e(p.name)}</h3><span class="muted">${e(p.category)}</span></div></div><div class="detail-list">${[['Nhóm hàng',p.category],['Đơn vị tính',p.unit],['Quy cách / thông số',p.spec||'—'],['Nguồn nhập / nhà cung cấp',sourceName(p)],['Giá tham khảo',money(p.price)],['Ghi chú',p.note||'—']].map(([k,v])=>`<div class="detail-row"><span>${e(k)}</span><strong>${e(v)}</strong></div>`).join('')}</div>`,btn('Đóng','close')+btn(ic('edit',14)+' Sửa mặt hàng','edit:product:'+p.id,'btn-primary'))}
if(type==='document'){let o=data[kind].find(x=>x.id===id);if(!o)return'';const purchase=kind==='purchases';return modalLayout('Chi tiết chứng từ '+id,'Chứng từ mô phỏng – không tác động kho hoặc công nợ',`<div class="detail-list">${[['Số chứng từ',o.id],['Ngày',dmy(o.date)],[purchase?'Nhà cung cấp':'Khách hàng',partner(o.partnerId)],['Trạng thái',o.status],['Số hóa đơn liên kết',purchase?invNumForPurchase(o.id):invNumForSale(o.id)],['Diễn giải',o.note||'—']].map(([k,v])=>`<div class="detail-row"><span>${e(k)}</span><strong>${e(v)}</strong></div>`).join('')}</div><div class="separator"></div><h3 style="font-size:13px">Hàng hóa trên chứng từ</h3>${tableWrap(['HÀNG HÓA','SL','ĐƠN GIÁ','THÀNH TIỀN'],o.items.map(it=>`<tr><td>${e(product(it.productId).name)}</td><td>${it.qty}</td><td>${money(it.price)}</td><td>${money(it.qty*it.price)}</td></tr>`).join(''))}<div class="r-between" style="padding-top:15px"><span>Tổng tiền hàng mẫu</span><strong>${money(total(o))}</strong></div>`,btn('Đóng','close')+btn(ic('edit',14)+' Sửa chứng từ','edit:document:'+kind+':'+id,'btn-primary'))}
if(type==='invoice'){let x=(kind==='purchases'?data.purchaseInvoices:data.saleInvoices).find(x=>x.id===id);if(!x)return'';return modalLayout('Chi tiết hóa đơn '+x.number,'Hóa đơn lưu trong bộ dữ liệu mẫu',`<div class="detail-list">${[['Số hóa đơn',x.number],['Ký hiệu',x.series],['Ngày hóa đơn',dmy(x.date)],['Đối tác',partner(x.partnerId)],['Chứng từ liên kết',x.purchaseId||x.saleId||'—'],['Ghi chú',x.note||'—']].map(([k,v])=>`<div class="detail-row"><span>${e(k)}</span><strong>${e(v)}</strong></div>`).join('')}</div><div class="separator"></div><div class="notice-panel">${ic('info',18)} Bản ghi này không phải hóa đơn điện tử đã được phát hành hoặc xác thực.</div>`,btn('Đóng','close'))}
if(type==='partner'){let p=data.partners.find(x=>x.id===kind);if(!p)return'';return modalLayout('Thông tin đối tác '+p.id,'Thông tin minh họa',`<div class="detail-list">${[['Tên',p.name],['Loại',p.kind==='supplier'?'Nhà cung cấp':'Khách hàng'],['Số điện thoại',p.phone],['Địa chỉ',p.address],['MST',p.taxCode||'—']].map(([k,v])=>`<div class="detail-row"><span>${e(k)}</span><strong>${e(v)}</strong></div>`).join('')}</div>`,btn('Đóng','close')+btn('Sửa','edit:partner:'+p.id,'btn-primary'))}
if(type==='movement'){let x=data.movements.find(x=>x.id===kind);if(!x)return'';return modalLayout('Phiếu kho '+x.id,'Chi tiết dữ liệu mô phỏng',`<div class="detail-list">${[['Ngày phiếu',dmy(x.date)],['Loại',x.kind],['Hàng hóa',product(x.productId).name],['Số lượng',x.qty+' '+product(x.productId).unit],['Ghi chú',x.note]].map(([k,v])=>`<div class="detail-row"><span>${e(k)}</span><strong>${e(v)}</strong></div>`).join('')}</div>`,btn('Đóng','close'))}
if(type==='check'){let x=data.stockChecks.find(x=>x.id===kind);return modalLayout('Phiếu kiểm kê '+kind,'Dữ liệu mẫu',`<div class="detail-list"><div class="detail-row"><span>Ngày</span><strong>${dmy(x?.date)}</strong></div><div class="detail-row"><span>Nội dung</span><strong>${e(x?.note)}</strong></div></div>`,btn('Đóng','close'))}
return''}
function renderModal(){let el=document.getElementById('modal-root');if(!el)return;if(!state.modal){el.innerHTML='';return}const [type,...args]=state.modal.split(':');let html='';switch(type){case 'new':if(args[0]==='product')html=productForm();else if(args[0]==='partner')html=partnerForm();else if(args[0]==='document')html=docForm(args[1]);else if(args[0]==='invoice'){state.invoiceKind=args[1];html=receiptPicker(args[1]);}else if(args[0]==='movement')html=movementForm(args[1]);else if(args[0]==='check')html=checkForm();break;case 'edit':if(args[0]==='product')html=productForm(args[1]);else if(args[0]==='stock')html=stockForm(args[1]);else if(args[0]==='partner')html=partnerForm(args[1]);else if(args[0]==='document')html=docForm(args[1],args[2]);break;case 'detail':html=detailModal(args);break;case 'receiptForm':html=invoiceForm(state.invoiceKind);break;case 'confirm-reset':html=modalLayout('Khôi phục dữ liệu demo?','Thao tác này sẽ xóa các bản ghi do bạn thêm trong trình duyệt',`<div class="notice-panel">${ic('alert',21)} Dữ liệu sẽ trở về bộ dữ liệu mẫu ban đầu. Không thể hoàn tác việc này trong prototype.</div>`,btn('Hủy','close')+btn('Khôi phục','reset-confirm','btn-danger'));break;case 'about':html=modalLayout('Về bản demo Foodland','Prototype tương tác dùng để duyệt thiết kế',`<div class="detail-list"><div class="detail-row"><span>Thiết kế</span><strong>Modern SaaS / Foodland v2</strong></div><div class="detail-row"><span>Trạng thái</span><strong>UI Prototype – Mock Data</strong></div><div class="detail-row"><span>Đã thử được</span><strong>Chuyển trang, bảng, form, hóa đơn, xuất CSV</strong></div><div class="detail-row"><span>Chưa triển khai</span><strong>Backend, database, nghiệp vụ kế toán, thuế</strong></div></div>`,btn('Đóng','close'));break;default:break}el.innerHTML=html}
function recomputeLines(){const body=document.getElementById('entry-rows');if(!body)return;let sum=0;[...body.querySelectorAll('tr')].forEach((tr,i)=>{tr.querySelector('td:first-child').textContent=i+1;let val=Number(tr.querySelector('.line-qty')?.value||0)*Number(tr.querySelector('.line-price')?.value||0);sum+=val;let target=tr.querySelector('.line-total');if(target)target.textContent=money(val)});let el=document.getElementById('entry-grand');if(el)el.textContent=money(sum)}
function getLineItems(){return [...document.querySelectorAll('#entry-rows .entry-line')].map(row=>({productId:row.querySelector('.line-product').value,qty:Number(row.querySelector('.line-qty').value),price:Number(row.querySelector('.line-price').value)})).filter(x=>x.productId&&x.qty>0)}
function getFormValues(form){return Object.fromEntries(new FormData(form).entries())}
function submitForm(form){let type=form.dataset.form;const v=getFormValues(form);if(type==='product'){if(!v.id.trim()||!v.name.trim())return toast('Cần điền mã và tên hàng hóa');if(data.products.some(p=>p.id===v.id&&p.id!==v.oldId))return toast('Mã hàng này đã tồn tại');const old=data.products.find(p=>p.id===v.oldId);let rec={id:v.id.trim(),name:v.name.trim(),category:v.category,unit:v.unit,spec:v.spec||'',supplierId:v.supplierId||'',price:Number(v.price)||0,stock:old?.stock??0,min:old?.min??10,note:v.note||''};if(v.oldId){let index=data.products.findIndex(x=>x.id===v.oldId);if(index>=0)data.products[index]=rec}else data.products.unshift(rec);toast('Đã lưu danh mục hàng hóa mẫu (không thay đổi tồn kho)')}
else if(type==='stock'){let p=data.products.find(x=>x.id===v.productId);if(!p)return toast('Không tìm thấy hàng hóa');if(Number(v.stock)<0||Number(v.min)<0)return toast('Không được nhập số âm');p.stock=Number(v.stock)||0;p.min=Number(v.min)||0;toast('Đã chỉnh dữ liệu tồn kho mẫu – không phát sinh chứng từ')}
else if(type==='partner'){let rec={id:v.id.trim(),name:v.name.trim(),kind:v.kind,phone:v.phone,address:v.address,taxCode:v.taxCode};if(!rec.id||!rec.name)return toast('Cần nhập mã và tên đối tác');if(data.partners.some(x=>x.id===rec.id&&x.id!==v.oldId))return toast('Mã đối tác đã tồn tại');if(v.oldId){data.partners[data.partners.findIndex(x=>x.id===v.oldId)]=rec}else data.partners.unshift(rec);toast('Đã lưu thông tin đối tác mẫu')}
else if(type==='document'){let kind=form.dataset.kind;let items=getLineItems();if(!v.partnerId||!v.id.trim())return toast('Vui lòng chọn đối tác và số chứng từ');if(!items.length)return toast('Hãy thêm ít nhất một mặt hàng có số lượng hợp lệ');if(data[kind].some(x=>x.id===v.id&&x.id!==v.oldId))return toast('Số chứng từ đã tồn tại');let rec={id:v.id.trim(),date:v.date,partnerId:v.partnerId,status:'Bản nháp',note:v.note,items};if(v.oldId){let index=data[kind].findIndex(x=>x.id===v.oldId);let old=data[kind][index];rec.status=old?.status||'Bản nháp';data[kind][index]=rec}else data[kind].unshift(rec);toast('Đã lưu chứng từ mẫu – không cập nhật tồn kho')}
else if(type==='invoice'){let purchase=form.dataset.kind==='purchases',group=purchase?'purchaseInvoices':'saleInvoices',docGroup=purchase?'purchases':'sales',ref=data[docGroup].find(x=>x.id===v.refId);if(!v.number.trim()||!v.date||!ref)return toast('Vui lòng nhập số, ngày hóa đơn và chọn chứng từ liên kết');if(data[group].some(x=>purchase?x.purchaseId===ref.id:x.saleId===ref.id))return toast('Chứng từ này đã được gắn hóa đơn');const rec={id:(purchase?'HDM':'HDB')+String(data[group].length+1).padStart(3,'0'),number:v.number.trim(),series:v.series,date:v.date,partnerId:ref.partnerId,note:v.note||'',template:v.template||'',paymentMethod:v.paymentMethod||'',taxCode:v.taxCode||'',address:v.address||'',...(purchase?{purchaseId:ref.id}:{saleId:ref.id,status:'Bản nháp'})};data[group].unshift(rec);state.tab='invoices';toast(purchase?'Đã liên kết hóa đơn mẫu với chứng từ mua':'Đã liên kết hóa đơn mẫu với chứng từ bán (chưa phát hành)')}
else if(type==='movement'){let rec={id:v.id.trim(),date:v.date,kind:form.dataset.kind==='in'?'Nhập kho':'Xuất kho',productId:v.productId,qty:Number(v.qty),note:v.note};if(!rec.id||!rec.productId||rec.qty<=0)return toast('Nhập mặt hàng và số lượng hợp lệ');if(data.movements.some(m=>m.id===rec.id))return toast('Mã phiếu đã tồn tại');data.movements.unshift(rec);toast('Đã lưu phiếu mẫu – chưa cập nhật tồn kho')}
else if(type==='check'){data.stockChecks.unshift({id:'KK'+String(data.stockChecks.length+1).padStart(4,'0'),date:v.date,status:'Bản nháp',note:v.note});toast('Đã thêm phiếu kiểm kê mẫu')}
save();state.modal=null;state.search='';state.filter='all';render()}
function exportCSV(name){let rows=[];switch(name){case 'products':rows=[['Mã hàng','Tên hàng','Nhóm hàng','Đơn vị','Quy cách','Nguồn nhập','Giá tham khảo'],...data.products.map(p=>[p.id,p.name,p.category,p.unit,p.spec||'',sourceName(p),p.price])];break;case 'inventory':rows=[['Mã hàng','Tên hàng','Đơn vị','Số lượng tồn mẫu','Ngưỡng tồn tối thiểu','Trạng thái'],...data.products.map(p=>[p.id,p.name,p.unit,p.stock,p.min,stockStatus(p)[0]])];break;case 'purchases':case 'sales':rows=[['Số chứng từ','Ngày','Đối tác','Giá trị mẫu','Trạng thái','Số hóa đơn'],...data[name].map(x=>[x.id,x.date,partner(x.partnerId),total(x),x.status,name==='purchases'?invNumForPurchase(x.id):invNumForSale(x.id)])];break;case 'purchaseInvoices':case 'saleInvoices':rows=[['Số hóa đơn','Ký hiệu','Ngày','Đối tác','Chứng từ liên kết'],...data[name].map(x=>[x.number,x.series,x.date,partner(x.partnerId),x.purchaseId||x.saleId||''])];break;case 'partners':rows=[['Mã','Tên','Loại','SĐT','Địa chỉ'],...data.partners.map(x=>[x.id,x.name,x.kind,x.phone,x.address])];break;case 'movements':rows=[['Mã phiếu','Ngày','Loại','Mặt hàng','Số lượng'],...data.movements.map(x=>[x.id,x.date,x.kind,product(x.productId).name,x.qty])];break;case 'reports':rows=[['Loại giao dịch','Ngày','Số chứng từ','Đối tác','Mặt hàng','Tổng tiền (mẫu)','Trạng thái'],...reportRows().map(x=>[x.kind,x.date,x.id,partner(x.partnerId),x.items.map(it=>product(it.productId).name).join('; '),total(x),x.status])];break;default:rows=[['Tháng','Giá trị bán (triệu mẫu)','Giá trị mua (triệu mẫu)'],...[60,80,77,110,88,100,112,96,128,110,120,135].map((n,i)=>['T'+(i+1),n,[44,60,69,70,75,85,70,82,95,85,78,90][i]])]}
const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='foodland_demo_'+name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),800);toast('Đã xuất CSV dữ liệu mẫu')}
function handleAction(action){const pieces=action.split(':');switch(pieces[0]){case 'nav':goto(pieces[1]);break;case 'close':state.modal=null;renderModal();break;case 'new':case 'edit':case 'detail':if(pieces[0]==='new'&&pieces[1]==='invoice'){state.selectedReceipt=null;state.invoiceKind=pieces[2];state.receiptFilters={supplier:'all',from:'2026-10-01',to:today,search:''}}state.modal=action;renderModal();break;case 'add-line':{const rows=document.getElementById('entry-rows');if(rows)rows.insertAdjacentHTML('beforeend',lineEntry({},rows.children.length));recomputeLines();break}case 'remove-line':break;case 'picker-load':{state.receiptFilters={supplier:document.getElementById('picker-supplier')?.value||'all',from:document.getElementById('picker-from')?.value||'',to:document.getElementById('picker-to')?.value||'',search:document.getElementById('picker-search')?.value||''};state.selectedReceipt=null;renderModal();break}case 'change-receipt':state.selectedReceipt=null;state.modal='new:invoice:'+state.invoiceKind;renderModal();break;case 'receipt-continue':if(!state.selectedReceipt){toast('Hãy chọn một chứng từ');break;}state.modal='receiptForm';renderModal();break;case 'export':exportCSV(pieces[1]);break;case 'reset':state.modal='confirm-reset';renderModal();break;case 'reset-confirm':data=seed();data.products.forEach((p,i)=>{p.supplierId=['NCC001','NCC002','NCC003'][i%3];p.spec=['Thùng / hộp tiêu chuẩn','Gói tiêu chuẩn','Đóng gói nguyên kiện'][i%3]});save();state.modal=null;state.search='';state.filter='all';render();toast('Đã khôi phục dữ liệu mẫu');break;case 'date-info':toast('Bộ lọc ngày chưa chốt với kế toán, hiện đang xem dữ liệu tháng mẫu');break;case 'about':state.modal='about';renderModal();break;case 'toggle-notice':state.notice=!state.notice;document.getElementById('notice-pop')?.remove();if(state.notice){document.body.insertAdjacentHTML('beforeend',`<div class="top-popover" id="notice-pop"><div class="r-between"><strong>Thông báo demo</strong><span class="demo-ribbon">MẪU</span></div><div class="separator"></div><div class="r-flex">${ic('info',18)}<span>Đây là prototype, chưa có thông báo hệ thống thực tế.</span></div></div>`)}break;default:break}}
document.addEventListener('click',ev=>{
let nav=ev.target.closest('[data-nav]');if(nav){ev.preventDefault();goto(nav.dataset.nav);return}
let tab=ev.target.closest('[data-tab]');if(tab){switchTab(tab.dataset.tab);return}
let pk=ev.target.closest('[data-partnerkind]');if(pk){state.partnerKind=pk.dataset.partnerkind;state.search='';state.filter='all';renderPage();return}
let rt=ev.target.closest('[data-report]');if(rt){state.reportTab=rt.dataset.report;renderPage();return}
let kindBtn=ev.target.closest('[data-report-kind]');if(kindBtn){state.reportDocKind=kindBtn.dataset.reportKind;renderPage();return}
let select=ev.target.closest('[data-select-receipt]');if(select){state.selectedReceipt=select.dataset.selectReceipt;renderModal();return}
let action=ev.target.closest('[data-action]');if(action){let a=action.dataset.action;if(a==='remove-line'){let row=action.closest('tr');row?.remove();recomputeLines();return}handleAction(a);return}
if(ev.target?.dataset?.backdrop==='1'){state.modal=null;renderModal()}
});
document.addEventListener('input',ev=>{
 const el=ev.target;if(el.matches('[data-role="search"]')){let start=el.selectionStart;state.search=el.value;renderPage();let next=document.querySelector('[data-role="search"]');next?.focus();try{next?.setSelectionRange(start,start)}catch{}return}
 if(el.matches('[data-report-search]')){const cursor=el.selectionStart;state.reportSearch=el.value;renderPage();const next=document.querySelector('[data-report-search]');next?.focus();next?.setSelectionRange(cursor,cursor);return}
 if(el.matches('[data-role="filter"]')){state.filter=el.value;renderPage();return}
 if(el.matches('.line-qty,.line-price'))recomputeLines();
});
document.addEventListener('change',ev=>{let el=ev.target;if(el.matches('[data-role="filter"]')){state.filter=el.value;renderPage()}if(el.matches('.line-product')){let row=el.closest('tr');const p=product(el.value);row.querySelector('.unit-value').textContent=p.unit||'—';row.querySelector('.line-price').value=p.price||0;recomputeLines()}});
document.addEventListener('submit',ev=>{if(ev.target.getAttribute('id')==='active-form'){ev.preventDefault();submitForm(ev.target)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){state.modal=null;renderModal();document.getElementById('notice-pop')?.remove()}if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();document.getElementById('globalSearch')?.focus()}if(ev.target.id==='globalSearch'&&ev.key==='Enter'){ev.preventDefault();state.page='products';state.tab='';state.search=ev.target.value;state.filter='all';render();}});
render();

</script></body></html>
